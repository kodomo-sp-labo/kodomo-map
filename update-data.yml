name: 資源マップ データ定期更新チェック

# 毎月1日 午前3時（UTC）= 日本時間 正午 に自動実行。
# 手動実行（workflow_dispatch）もできるようにしておく。
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

jobs:
  update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Claude Codeでデータソースを確認・更新
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 具体的な手順は別ファイルに分離（長いプロンプトをYAML内に書かない）
          prompt_file: .github/claude-prompts/update-data-sources.md
          # Claude Codeにブランチ作成・コミット・PR作成の権限のみ与える
          allowed_tools: "bash,file_edit,web_search,web_fetch"
          # 直接mainに触らせず、必ずブランチ+PR経由にする
          create_pull_request: true
          pull_request_branch_prefix: "auto-update/"

      - name: 実行結果を通知（失敗時のみ）
        if: failure()
        run: |
          echo "::warning::データ更新チェックが失敗しました。Actionsのログを確認してください。"
